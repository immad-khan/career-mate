name: Deploy Django to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: 'temp-key-for-collectstatic'
          DEBUG: 'False'

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".venv/*" \
            -x "careermate-frontend/*" \
            -x "*.env" \
            -x "*.env.local" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "check*.txt" \
            -x "check*.py" \
            -x "list_users.py" \
            -x "user_details.py" \
            -x "user_role.py" \
            -x "run_migrations.py" \
            -x "rozee-tmp.html" \
            -x "test_cheerio2.js" \
            -x "pysys.txt" \
            -x "pyver.txt" \
            -x "users_list.txt" \
            -x "logs/*" \
            -x ".vscode/*" \
            -x "webcroller/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'careermate-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip